<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能化认知诊断系统（MVP）</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- ECharts 5 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        :root {
            --bs-body-bg: #f5f7fa;
        }
        body {
            background: var(--bs-body-bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
        }
        .header-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 1.5rem 0;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 12px rgba(102,126,234,0.35);
        }
        .header-bar h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 0;
        }
        .header-bar .badge {
            font-size: 0.7rem;
            vertical-align: middle;
            margin-left: 0.5rem;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            margin-bottom: 1.2rem;
        }
        .card-header {
            background: #fff;
            border-bottom: 1px solid #eee;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 12px 12px 0 0 !important;
            padding: 0.75rem 1.2rem;
        }
        #radar-chart {
            width: 100%;
            height: 420px;
        }
        .kp-table th {
            font-size: 0.85rem;
            color: #666;
        }
        .mastery-bar {
            height: 8px;
            border-radius: 4px;
            background: #e9ecef;
            overflow: hidden;
        }
        .mastery-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        .kg-edge-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .kg-badge {
            background: #eef2ff;
            color: #4338ca;
            padding: 0.35rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .advice-box {
            background: #fffbeb;
            border-left: 4px solid #f59e0b;
            padding: 1rem 1.2rem;
            border-radius: 0 8px 8px 0;
            white-space: pre-wrap;
            line-height: 1.7;
            font-size: 0.92rem;
            max-height: 400px;
            overflow-y: auto;
        }
        .advice-box:empty::after {
            content: "点击上方按钮生成学习建议";
            color: #999;
            font-style: italic;
        }
        .spinner-border-sm {
            margin-right: 0.4rem;
        }
        #student-select {
            max-width: 280px;
        }
        .summary-badges .badge {
            font-size: 0.85rem;
            padding: 0.4rem 0.8rem;
        }
    </style>
</head>
<body>

<!-- ═══════════════ 标题区 ═══════════════ -->
<div class="header-bar">
    <div class="container">
        <h1>
            📊 智能化认知诊断系统
            <span class="badge bg-light text-dark">MVP</span>
        </h1>
        <small class="opacity-75">基于 DINA 模型 · 5 知识点 · 20 题目 · 12 学生</small>
    </div>
</div>

<div class="container">

    <!-- ═══════════════ 选择区 ═══════════════ -->
    <div class="card">
        <div class="card-body d-flex align-items-center gap-3 flex-wrap">
            <label for="student-select" class="form-label mb-0 fw-semibold text-nowrap">
                👤 选择学生：
            </label>
            <select id="student-select" class="form-select" disabled>
                <option value="">加载中...</option>
            </select>
            <span id="summary-badges" class="summary-badges d-flex gap-2"></span>
        </div>
    </div>

    <!-- ═══════════════ 主展示区：雷达图 + 数据表 ═══════════════ -->
    <div class="row">
        <!-- 雷达图 -->
        <div class="col-lg-7">
            <div class="card">
                <div class="card-header">🎯 知识点掌握雷达图</div>
                <div class="card-body p-2">
                    <div id="radar-chart"></div>
                    <div id="weak-kp-container" class="mt-2 px-2"></div>
                </div>
            </div>
        </div>

        <!-- 诊断数据表 -->
        <div class="col-lg-5">
            <div class="card">
                <div class="card-header">📋 诊断详情</div>
                <div class="card-body">
                    <div id="student-info" class="mb-2 text-muted small"></div>
                    <table class="table table-hover kp-table mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>知识点</th>
                                <th style="width:120px">掌握概率</th>
                                <th style="width:80px">等级</th>
                            </tr>
                        </thead>
                        <tbody id="kp-table-body">
                            <tr><td colspan="3" class="text-center text-muted">请选择学生</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══════════════ 知识图谱区 ═══════════════ -->
    <div class="card">
        <div class="card-header">🔗 知识图谱 — 学习路径依赖关系</div>
        <div class="card-body">
            <div id="kg-container" class="kg-edge-list">
                <span class="text-muted">加载中...</span>
            </div>
        </div>
    </div>

    <!-- ═══════════════ 学习建议区（加分项） ═══════════════ -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>🤖 AI 学习建议</span>
            <button id="btn-advice" class="btn btn-sm btn-warning" disabled>
                生成学习建议
            </button>
        </div>
        <div class="card-body">
            <div id="advice-box" class="advice-box"></div>
        </div>
    </div>

</div><!-- /container -->

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* ═══════════════════════════════════════════════
   ECharts 雷达图 — 全局实例
   ═══════════════════════════════════════════════ */
const chartDom = document.getElementById('radar-chart');
const radarChart = echarts.init(chartDom);

let currentStudentId = null;

/* ── 雷达图默认配置 ── */
const radarOption = {
    tooltip: { trigger: 'item' },
    legend: { bottom: 0, data: ['掌握概率'] },
    radar: {
        center: ['50%', '52%'],
        radius: '72%',
        indicator: [
            { name: '知识点', max: 1 }
        ],
        axisName: {
            fontSize: 13,
            color: '#333'
        }
    },
    series: [{
        type: 'radar',
        name: '掌握概率',
        data: [{ value: [], name: '' }],
        areaStyle: { color: 'rgba(102,126,234,0.25)' },
        lineStyle: { color: '#667eea', width: 2 },
        itemStyle: { color: '#667eea' },
        symbol: 'circle',
        symbolSize: 6
    }]
};

/* ── 渲染空雷达图 ── */
radarChart.setOption(radarOption);

/* ═══════════════════════════════════════════════
   API 调用辅助
   ═══════════════════════════════════════════════ */
async function fetchJSON(url) {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${url}`);
    return resp.json();
}

/* ═══════════════════════════════════════════════
   初始化：加载学生列表 & 知识图谱
   ═══════════════════════════════════════════════ */
async function initPage() {
    try {
        await Promise.all([
            loadStudents(),
            loadKnowledgeGraph()
        ]);
    } catch (e) {
        console.error('页面初始化失败:', e);
    }
}

async function loadStudents() {
    const select = document.getElementById('student-select');
    try {
        const data = await fetchJSON('/api/students');
        select.innerHTML = '<option value="">-- 请选择学生 --</option>';
        data.students.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = `${s.name} (ID:${s.id})`;
            select.appendChild(opt);
        });
        select.disabled = false;

        // 默认选中第一个学生
        if (data.students.length > 0) {
            select.value = data.students[0].id;
            await onStudentChange();
        }
    } catch (e) {
        select.innerHTML = '<option value="">加载失败</option>';
    }
}

async function loadKnowledgeGraph() {
    const container = document.getElementById('kg-container');
    try {
        const data = await fetchJSON('/api/knowledge_graph');
        container.innerHTML = data.edges.map(e =>
            `<span class="kg-badge">${e.predecessor_name} → ${e.successor_name}</span>`
        ).join('');
        if (data.edges.length === 0) {
            container.innerHTML = '<span class="text-muted">暂无知识图谱数据</span>';
        }
    } catch (e) {
        container.innerHTML = '<span class="text-danger">知识图谱加载失败</span>';
    }
}

/* ═══════════════════════════════════════════════
   学生切换 → 更新雷达图 + 数据表
   ═══════════════════════════════════════════════ */
document.getElementById('student-select').addEventListener('change', onStudentChange);

async function onStudentChange() {
    const select = document.getElementById('student-select');
    const sid = parseInt(select.value);
    if (!sid) {
        resetDisplay();
        return;
    }
    currentStudentId = sid;

    try {
        const data = await fetchJSON(`/api/diagnosis/${sid}`);
        updateRadarChart(data);
        updateTable(data);
        clearAdvice();

        // 启用建议按钮
        document.getElementById('btn-advice').disabled = false;
    } catch (e) {
        console.error('诊断数据加载失败:', e);
        resetDisplay();
    }
}

/* ── 更新雷达图 ── */
function updateRadarChart(data) {
    const indicator = data.radar_data.map(d => ({
        name: d.knowledge_point_name,
        max: 1
    }));
    const values = data.radar_data.map(d => d.mastery_probability);

    radarChart.setOption({
        radar: { indicator },
        series: [{
            data: [{ value: values, name: data.student_name }]
        }]
    });
}

/* ── 更新诊断数据表 ── */
function updateTable(data) {
    // 学生信息（姓名高亮显示）
    document.getElementById('student-info').innerHTML =
        `<span class="badge bg-primary bg-gradient px-3 py-2 fs-6">
            👤 ${data.student_name}
         </span>
         <span class="text-muted small ms-1">(ID:${data.student_id})</span>
         <span class="text-muted small ms-2">
            正确 ${data.answer_summary.correct}/${data.answer_summary.total} 题
         </span>`;

    // 作答摘要标签
    const summary = data.answer_summary;
    document.getElementById('summary-badges').innerHTML =
        `<span class="badge bg-success">✅ 正确 ${summary.correct}</span>
         <span class="badge bg-danger">❌ 错误 ${summary.incorrect}</span>`;

    // 薄弱知识点红标签（掌握概率 < 0.6）
    renderWeakKPs(data);

    // 知识点表格
    const tbody = document.getElementById('kp-table-body');
    tbody.innerHTML = data.radar_data.map(d => {
        const pct = (d.mastery_probability * 100).toFixed(1);
        let level, barColor;
        if (d.mastery_probability >= 0.8) { level = '优秀'; barColor = '#22c55e'; }
        else if (d.mastery_probability >= 0.6) { level = '良好'; barColor = '#3b82f6'; }
        else if (d.mastery_probability >= 0.4) { level = '一般'; barColor = '#f59e0b'; }
        else { level = '薄弱'; barColor = '#ef4444'; }

        let levelBadge;
        if (level === '优秀') levelBadge = 'bg-success';
        else if (level === '良好') levelBadge = 'bg-primary';
        else if (level === '一般') levelBadge = 'bg-warning text-dark';
        else levelBadge = 'bg-danger';

        return `
            <tr>
                <td class="fw-medium">${d.knowledge_point_name}</td>
                <td>
                    <div class="d-flex align-items-center gap-2">
                        <span class="small" style="min-width:42px">${pct}%</span>
                        <div class="mastery-bar flex-grow-1">
                            <div class="mastery-bar-fill" style="width:${pct}%;background:${barColor}"></div>
                        </div>
                    </div>
                </td>
                <td><span class="badge ${levelBadge}">${level}</span></td>
            </tr>`;
    }).join('');
}

/* ── 渲染薄弱知识点红标签（掌握概率 < 0.6） ── */
function renderWeakKPs(data) {
    const weakKPs = data.radar_data.filter(d => d.mastery_probability < 0.6);
    const container = document.getElementById('weak-kp-container');

    if (weakKPs.length === 0) {
        container.innerHTML =
            '<span class="badge bg-success-subtle text-success">✅ 无薄弱知识点，全部掌握良好</span>';
        return;
    }

    container.innerHTML =
        `<span class="text-danger fw-semibold me-2">⚠️ 薄弱知识点：</span>` +
        weakKPs.map(d =>
            `<span class="badge bg-danger me-1">${d.knowledge_point_name} ${(d.mastery_probability * 100).toFixed(0)}%</span>`
        ).join('');
}

/* ── 重置显示 ── */
function resetDisplay() {
    radarChart.setOption({
        radar: { indicator: [{ name: '知识点', max: 1 }] },
        series: [{ data: [{ value: [], name: '' }] }]
    });
    document.getElementById('kp-table-body').innerHTML =
        '<tr><td colspan="3" class="text-center text-muted">请选择学生</td></tr>';
    document.getElementById('student-info').innerHTML = '';
    document.getElementById('summary-badges').innerHTML = '';
    document.getElementById('weak-kp-container').innerHTML = '';
    document.getElementById('btn-advice').disabled = true;
}

/* ═══════════════════════════════════════════════
   学习建议（加分项）
   ═══════════════════════════════════════════════ */
document.getElementById('btn-advice').addEventListener('click', generateAdvice);

async function generateAdvice() {
    if (!currentStudentId) return;

    const btn = document.getElementById('btn-advice');
    const box = document.getElementById('advice-box');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>思考中...';
    box.textContent = '';

    try {
        const resp = await fetch(`/api/advice/${currentStudentId}`, { method: 'POST' });
        const data = await resp.json();
        box.textContent = data.advice || '（未获取到建议内容）';
    } catch (e) {
        box.innerHTML = `<span class="text-danger">请求失败：${e.message}</span>`;
    } finally {
        btn.disabled = false;
        btn.textContent = '生成学习建议';
    }
}

function clearAdvice() {
    document.getElementById('advice-box').textContent = '';
}

/* ── 窗口大小变化时自适应雷达图 ── */
window.addEventListener('resize', () => radarChart.resize());

/* ── 启动 ── */
document.addEventListener('DOMContentLoaded', initPage);
</script>
</body>
</html>
